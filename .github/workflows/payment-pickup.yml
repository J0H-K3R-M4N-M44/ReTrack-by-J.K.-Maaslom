name: PHP shop workflow checks
on:
  push:
    branches: [Workspace-Design, Repair-Board-Preview, Intake-Customer-Search, PHP-Bill-Corrections-Integration, PHP-Stock-Cancellation-Integration, Stock-Transfer-Integrity, Stock-Returns-Integrity, Branch-Repair-Acceptance, Stock-Quarantine-Counts, Stock-Disposition-Approvals, Parts-Transfers-Reconciliation, Parts-Loss-Resolution, Loss-Status-Schema-Hotfix, Parts-Loss-Recovery, Inventory-Evidence-Attachments, Inventory-Loss-Valuation, Verified-Parts-Cost-Register, Periodic-Stocktaking-Signoff, main, MVP-Stabilization, MVP-UX-Polish-2026-11-25]
    paths:
      - '.github/workflows/payment-pickup.yml'
      - 'tests/payment-pickup.php'
      - 'app/**'
      - 'database/schema.sql'
      - 'database/bill_corrections.sql'
      - 'tools/migration_support.php'
      - 'admin/**'
      - 'views/**'
      - 'css/**'
      - 'js/**'
      - 'tests/payment-browser.mjs'
      - 'tests/checkout-concurrency.php'
      - 'tests/stock-pilot.php'
      - 'tests/stock-quarantine.php'
      - 'tests/parts-transfer.php'
      - 'tests/parts-loss.php'
      - 'tests/parts-recovery.php'
      - 'tests/stock-evidence.php'
      - 'tests/stock-valuation.php'
      - 'tests/part-acquisition-costs.php'
      - 'tests/stocktaking.php'
      - 'database/inventory_stocktaking.sql'
      - 'database/part_acquisition_cost_records.sql'
      - 'database/stock_transfer_loss_valuations.sql'
      - 'database/stock_transfer_evidence.sql'
      - 'database/stock_transfer_recoveries.sql'
      - 'database/stock_transfer_losses.sql'
      - 'database/stock_quarantine.sql'
      - 'database/stock_approvals.sql'
      - 'app/inventory/**'
      - 'database/stock_reservations.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-pickup:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable MySQL database
        env:
          MYSQL_PWD: root
        run: |
          sudo systemctl start mysql
          sed -e 's/^CREATE DATABASE IF NOT EXISTS repairtrack$/CREATE DATABASE IF NOT EXISTS repairtrack_test_pickup/' \
              -e 's/^USE repairtrack;$/USE repairtrack_test_pickup;/' database/schema.sql | mysql -h 127.0.0.1 -u root
      - name: Run PHP payment and pickup check
        run: |
          php -r 'foreach (["pdo_mysql","mbstring","fileinfo"] as $extension) { if (!extension_loaded($extension)) { exit(1); } }'
          mkdir -p "$RUNNER_TEMP/repairtrack-evidence" "$RUNNER_TEMP/repairtrack-inventory-evidence"
          cat > config/config.php <<PHP
          <?php
          return [
              'host' => '127.0.0.1',
              'database' => 'repairtrack_test_pickup',
              'username' => 'root',
              'password' => 'root',
              'intake_storage_path' => '$RUNNER_TEMP/repairtrack-evidence',
              'inventory_evidence_path' => '$RUNNER_TEMP/repairtrack-inventory-evidence',
              'intake_hmac_key' => str_repeat('a', 64),
          ];
          PHP
          php -l app/inventory/stock_ops.php
          php -l app/inventory/transfers.php
          php -l app/inventory/losses.php
          php -l app/inventory/recoveries.php
          php -l app/inventory/evidence.php
          php -l app/inventory/valuation.php
          php -l app/inventory/acquisition_costs.php
          php -l app/inventory/stocktaking.php
          php -l admin/stocktaking.php
          php -l tests/stocktaking.php
          php -l admin/acquisition_costs.php
          php -l tests/part-acquisition-costs.php
          php -l tests/stock-valuation.php
          php -l admin/stock_evidence.php
          php -l tests/stock-evidence.php
          php -l tools/cleanup_stock_evidence.php
          php -l tests/parts-recovery.php
          php -l tests/parts-loss.php
          php -l admin/parts_transfers.php
          php -l tests/parts-transfer.php
          php -l app/inventory/reservations.php
          php -l admin/inventory.php
          php -l tests/stock-quarantine.php
          php -l views/quotes/editor.php
          # Emulate upgrading an existing RepairTrack database on disposable test data.
          MYSQL_PWD=root mysql -h 127.0.0.1 -u root repairtrack_test_pickup -e 'DROP TABLE stock_count_reviews; DROP TABLE stock_quarantine_dispositions; DROP TABLE stock_quarantines;'
          # Simulate an existing installation with pre-loss enum values and no loss-case table.
          MYSQL_PWD=root mysql -h 127.0.0.1 -u root repairtrack_test_pickup -e "
            DROP TABLE inventory_stocktake_lines;
            DROP TABLE inventory_stocktakes;
            DROP TABLE stock_transfer_loss_valuations;
            DROP TABLE part_acquisition_cost_records;
            DROP TABLE stock_transfer_evidence;
            DROP TABLE stock_transfer_recoveries;
            DROP TABLE stock_transfer_loss_cases;
            ALTER TABLE inventory_transfer_items
              MODIFY item_status ENUM('IN_TRANSIT','RECEIVED','EXCEPTION','CANCELLED')
              NOT NULL DEFAULT 'IN_TRANSIT';
            ALTER TABLE inventory_transfers
              MODIFY status ENUM('IN_TRANSIT','RECEIVED','EXCEPTION','CANCELLED')
              NOT NULL DEFAULT 'IN_TRANSIT';
          "
          php tools/migrate.php --apply --yes
          php tools/migrate.php --status
          php tests/payment-pickup.php
          php tests/payment-pickup.php --cancel
          php tests/payment-pickup.php --cancel-free
          php tests/payment-pickup.php --concurrency
          php tests/payment-pickup.php --stock-pilot
          php tests/payment-pickup.php --stock-operations
          php tests/payment-pickup.php --parts-transfer
          php tests/payment-pickup.php --parts-loss
          php tests/payment-pickup.php --parts-recovery
          php tests/payment-pickup.php --stock-evidence
          php tests/payment-pickup.php --stock-valuation
          # Rehearse an ADD COLUMN + FK migration with historical valuations already present.
          # This catches schema upgrades that only work on empty new installations.
          VALUATIONS_BEFORE=$(MYSQL_PWD=root mysql -N -h 127.0.0.1 -u root             repairtrack_test_pickup -e "SELECT CONCAT(COUNT(*), ':', COALESCE(SUM(exposure_php),0)) FROM stock_transfer_loss_valuations")
          MYSQL_PWD=root mysql -h 127.0.0.1 -u root repairtrack_test_pickup -e "
            ALTER TABLE stock_transfer_loss_valuations
              DROP FOREIGN KEY fk_loss_valuation_part_cost,
              DROP INDEX idx_loss_valuation_part_cost,
              DROP COLUMN part_acquisition_cost_id;
            DROP TABLE part_acquisition_cost_records;
          "
          php tools/migrate.php --apply --yes
          php tools/migrate.php --status
          VALUATIONS_AFTER=$(MYSQL_PWD=root mysql -N -h 127.0.0.1 -u root             repairtrack_test_pickup -e "SELECT CONCAT(COUNT(*), ':', COALESCE(SUM(exposure_php),0)) FROM stock_transfer_loss_valuations")
          test "$VALUATIONS_BEFORE" = "$VALUATIONS_AFTER"
          php tests/payment-pickup.php --part-costs
          php tests/payment-pickup.php --stocktaking
          # Repeat migration with nonempty signed and cancelled stocktake history.
          STOCKTAKES_BEFORE=$(MYSQL_PWD=root mysql -N -h 127.0.0.1 -u root repairtrack_test_pickup -e "SELECT CONCAT(COUNT(*), ':', SUM(status='SIGNED_OFF')) FROM inventory_stocktakes")
          php tools/migrate.php --apply --yes
          STOCKTAKES_AFTER=$(MYSQL_PWD=root mysql -N -h 127.0.0.1 -u root repairtrack_test_pickup -e "SELECT CONCAT(COUNT(*), ':', SUM(status='SIGNED_OFF')) FROM inventory_stocktakes")
          test "$STOCKTAKES_BEFORE" = "$STOCKTAKES_AFTER"
      - name: Walk through billing and pickup in Chrome
        run: |
          npm install --no-save --package-lock=false playwright-core@1.56.1
          export PICKUP_FIXTURE="$RUNNER_TEMP/pickup.json"
          php tests/payment-pickup.php --browser-fixture > "$PICKUP_FIXTURE"
          php -S 127.0.0.1:8742 > "$RUNNER_TEMP/php-server.log" 2>&1 &
          trap 'kill $!; rm -f "$PICKUP_FIXTURE"' EXIT
          curl --retry 8 --retry-connrefused --retry-delay 1 -fsS -o /dev/null http://127.0.0.1:8742/admin/login.php
          node tests/payment-browser.mjs
      - name: Save staff workspace screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staff-workspace-screens
          path: ${{ runner.temp }}/workspace-screens/
          retention-days: 7
          if-no-files-found: ignore
