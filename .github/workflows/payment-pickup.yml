name: PHP shop workflow checks
on:
  push:
    branches: [Workspace-Design, Repair-Board-Preview, Intake-Customer-Search, PHP-Bill-Corrections-Integration, PHP-Stock-Cancellation-Integration, Stock-Transfer-Integrity, Stock-Returns-Integrity, Branch-Repair-Acceptance, Stock-Quarantine-Counts, main]
    paths:
      - '.github/workflows/payment-pickup.yml'
      - 'tests/payment-pickup.php'
      - 'app/**'
      - 'database/schema.sql'
      - 'database/bill_corrections.sql'
      - 'tools/migration_support.php'
      - 'admin/**'
      - 'views/**'
      - 'css/**'
      - 'js/**'
      - 'tests/payment-browser.mjs'
      - 'tests/checkout-concurrency.php'
      - 'tests/stock-pilot.php'
      - 'tests/stock-quarantine.php'
      - 'database/stock_quarantine.sql'
      - 'app/inventory/**'
      - 'database/stock_reservations.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-pickup:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable MySQL database
        env:
          MYSQL_PWD: root
        run: |
          sudo systemctl start mysql
          sed -e 's/^CREATE DATABASE IF NOT EXISTS repairtrack$/CREATE DATABASE IF NOT EXISTS repairtrack_test_pickup/' \
              -e 's/^USE repairtrack;$/USE repairtrack_test_pickup;/' database/schema.sql | mysql -h 127.0.0.1 -u root
      - name: Run PHP payment and pickup check
        run: |
          php -r 'foreach (["pdo_mysql","mbstring","fileinfo"] as $extension) { if (!extension_loaded($extension)) { exit(1); } }'
          mkdir -p "$RUNNER_TEMP/repairtrack-evidence"
          cat > config/config.php <<PHP
          <?php
          return [
              'host' => '127.0.0.1',
              'database' => 'repairtrack_test_pickup',
              'username' => 'root',
              'password' => 'root',
              'intake_storage_path' => '$RUNNER_TEMP/repairtrack-evidence',
              'intake_hmac_key' => str_repeat('a', 64),
          ];
          PHP
          php -l app/inventory/stock_ops.php
          php -l app/inventory/reservations.php
          php -l admin/inventory.php
          php -l tests/stock-quarantine.php
          php -l views/quotes/editor.php
          # Emulate upgrading an existing RepairTrack database on disposable test data.
          MYSQL_PWD=root mysql -h 127.0.0.1 -u root repairtrack_test_pickup -e 'DROP TABLE stock_quarantines;'
          php tools/migrate.php --apply --yes
          php tools/migrate.php --status
          php tests/payment-pickup.php
          php tests/payment-pickup.php --cancel
          php tests/payment-pickup.php --cancel-free
          php tests/payment-pickup.php --concurrency
          php tests/payment-pickup.php --stock-pilot
          php tests/payment-pickup.php --stock-operations
      - name: Walk through billing and pickup in Chrome
        run: |
          npm install --no-save --package-lock=false playwright-core@1.56.1
          export PICKUP_FIXTURE="$RUNNER_TEMP/pickup.json"
          php tests/payment-pickup.php --browser-fixture > "$PICKUP_FIXTURE"
          php -S 127.0.0.1:8742 > "$RUNNER_TEMP/php-server.log" 2>&1 &
          trap 'kill $!; rm -f "$PICKUP_FIXTURE"' EXIT
          curl --retry 8 --retry-connrefused --retry-delay 1 -fsS -o /dev/null http://127.0.0.1:8742/admin/login.php
          node tests/payment-browser.mjs
      - name: Save staff workspace screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staff-workspace-screens
          path: ${{ runner.temp }}/workspace-screens/
          retention-days: 7
          if-no-files-found: ignore
