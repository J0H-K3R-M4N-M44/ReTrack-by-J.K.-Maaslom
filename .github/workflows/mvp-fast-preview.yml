name: RepairTrack MVP tracking preview

on:
  push:
    branches: [MVP-Fast-Preview-2026-11-22]
    paths:
      - 'tools/preview_router.php'
      - 'tools/start-mvp-preview.sh'
      - 'tools/seed.php'
      - 'views/public/tracking.php'
      - 'css/public.css'
      - '.github/workflows/mvp-fast-preview.yml'
      - 'tests/mvp-preview-snapshots.mjs'
      - '.github/workflows/mvp-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and page smoke
        run: |
          set -euo pipefail
          php -l tools/preview_router.php
          php -l views/public/tracking.php
          php -l tools/seed.php
          bash -n tools/start-mvp-preview.sh
          php -S 127.0.0.1:8742 -t . tools/preview_router.php > "$RUNNER_TEMP/preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5 6 7 8; do
            if curl -sS -o /dev/null http://127.0.0.1:8742/; then break; fi
            sleep 1
          done
          for path in / /index.php /css/base.css /css/public.css /js/landing.js /admin/login.php; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8742$path")
            echo "$path => $code"
            test "$code" = 200
          done
          for path in /config/config.php /.git/config /tools/seed.php /database/schema.sql; do
            test "$(curl --path-as-is -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:8742$path")" = 404
          done

  preview-windows:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Browser-route smoke on Windows
        shell: pwsh
        run: |
          php -l tools/preview_router.php
          php -l views/public/tracking.php
          $server = Start-Process -FilePath "php" -ArgumentList @("-S", "127.0.0.1:8742", "-t", ".", "tools/preview_router.php") -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP/preview.out" -RedirectStandardError "$env:RUNNER_TEMP/preview.err"
          try {
            Start-Sleep -Seconds 3
            foreach ($path in @("/", "/index.php", "/css/base.css", "/css/public.css", "/admin/login.php")) {
              $code = (Invoke-WebRequest -Uri "http://127.0.0.1:8742$path" -SkipHttpErrorCheck -UseBasicParsing).StatusCode
              Write-Host "$path => $code"
              if ($code -ne 200) { throw "Preview route $path returned $code" }
            }
            foreach ($path in @("/tools/seed.php", "/config/config.example.php", "/database/schema.sql")) {
              $code = (Invoke-WebRequest -Uri "http://127.0.0.1:8742$path" -SkipHttpErrorCheck -UseBasicParsing).StatusCode
              if ($code -ne 404) { throw "Internal route $path returned $code" }
            }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
            Get-Content "$env:RUNNER_TEMP/preview.err" -ErrorAction SilentlyContinue | Select-Object -Last 20
          }

  fictional-repair-journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    env:
      MYSQL_PWD: root
    steps:
      - uses: actions/checkout@v4
      - name: Build new test database and seed 24 fictional repairs
        run: |
          set -euo pipefail
          sudo systemctl start mysql
          sed -e 's/^CREATE DATABASE IF NOT EXISTS repairtrack$/CREATE DATABASE IF NOT EXISTS repairtrack_test_operator/' \
              -e 's/^USE repairtrack;$/USE repairtrack_test_operator;/' database/schema.sql \
              | mysql -h 127.0.0.1 -u root
          mkdir -p "$RUNNER_TEMP/intake" "$RUNNER_TEMP/stock"
          cat > config/config.php <<'PHP'
          <?php
          return [
              'host' => '127.0.0.1',
              'port' => 3306,
              'database' => 'repairtrack_test_operator',
              'username' => 'root',
              'password' => getenv('MYSQL_PWD'),
              'app_url' => 'http://127.0.0.1:8742',
              'intake_storage_path' => getenv('RUNNER_TEMP') . '/intake',
              'inventory_evidence_path' => getenv('RUNNER_TEMP') . '/stock',
              'intake_hmac_key' => str_repeat('ab', 32),
          ];
          PHP
          # Generated fictional credentials stay in this job and are never uploaded.
          php tools/seed.php > "$RUNNER_TEMP/private-seed-output"
          grep -q 'Created 24 simulated repairs' "$RUNNER_TEMP/private-seed-output"
          test "$(mysql -N -h 127.0.0.1 -u root repairtrack_test_operator -e 'SELECT COUNT(*) FROM ticket_devices')" = 24
          php -r '
          require "app/public/tracking.php";
          $pdo = getPDO();
          $record = $pdo->query("SELECT t.portal_code AS code, RIGHT(c.contact_value, 4) AS pin FROM repair_tickets t JOIN customer_contacts c ON c.customer_id = t.customer_id WHERE t.ticket_code = \"SIM-RT-001\" LIMIT 1")->fetch(PDO::FETCH_ASSOC);
          $repair = $record ? publicRepair($pdo, $record["code"], $record["pin"]) : null;
          if (!$repair || count($repair["devices"]) !== 1 || $repair["devices"][0]["repair_status"] !== "RECEIVED") {
              fwrite(STDERR, "Simulated customer tracking lookup failed.\n"); exit(1);
          }
          echo "PASS: 24 fictional repairs and customer tracking lookup.\n";
          '

  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MYSQL_PWD: root
      MVP_SCREENSHOT_OUTPUT: ${{ github.workspace }}/mvp-screenshots
      MVP_SCREENSHOT_FIXTURE: ${{ github.workspace }}/mvp-screenshot-fixture-private.json
    steps:
      - uses: actions/checkout@v4

      - name: Create disposable MySQL schema and fictional repair records
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start mysql
          sed -e 's/^CREATE DATABASE IF NOT EXISTS repairtrack$/CREATE DATABASE IF NOT EXISTS repairtrack_test_operator/' \
              -e 's/^USE repairtrack;$/USE repairtrack_test_operator;/' database/schema.sql \
              | mysql -h 127.0.0.1 -u root
          mkdir -p "$RUNNER_TEMP/mvp-intake" "$RUNNER_TEMP/mvp-stock"
          cat > config/config.php <<'PHP'
          <?php
          return [
              'host' => '127.0.0.1',
              'port' => 3306,
              'database' => 'repairtrack_test_operator',
              'username' => 'root',
              'password' => getenv('MYSQL_PWD'),
              'app_url' => 'http://127.0.0.1:8742',
              'intake_storage_path' => getenv('RUNNER_TEMP') . '/mvp-intake',
              'inventory_evidence_path' => getenv('RUNNER_TEMP') . '/mvp-stock',
              'intake_hmac_key' => str_repeat('ab', 32),
          ];
          PHP
          php tools/seed.php > "$RUNNER_TEMP/mvp-seed-credentials"
          export MVP_STAFF_PASSWORD="$(sed -n 's/^Generated simulation password (save it privately): //p' "$RUNNER_TEMP/mvp-seed-credentials")"
          test -n "$MVP_STAFF_PASSWORD"
          php -r '
          require "app/db.php";
          $pdo = getPDO();
          $record = $pdo->query("SELECT t.portal_code AS code, RIGHT(c.normalized_value, 4) AS pin, d.ticket_device_id AS device FROM repair_tickets t JOIN customer_contacts c ON c.customer_id = t.customer_id JOIN ticket_devices d ON d.ticket_id = t.ticket_id WHERE t.ticket_code = \"SIM-RT-003\" AND c.contact_type = \"PHONE\" LIMIT 1")->fetch(PDO::FETCH_ASSOC);
          if (!$record) { throw new RuntimeException("Demo tracking record not found"); }
          $record["password"] = getenv("MVP_STAFF_PASSWORD");
          file_put_contents(getenv("MVP_SCREENSHOT_FIXTURE"), json_encode($record, JSON_THROW_ON_ERROR));
          '
          test -s "$MVP_SCREENSHOT_FIXTURE"

      - name: Capture actual landing, tracking and staff pages in Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright-core@1.56.1
          export CHROME_PATH="$(command -v google-chrome)"
          php -S 127.0.0.1:8742 -t . tools/preview_router.php > "$RUNNER_TEMP/mvp-ui-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -f "$MVP_SCREENSHOT_FIXTURE"' EXIT
          curl --retry 8 --retry-connrefused --retry-delay 1 -fsS -o /dev/null http://127.0.0.1:8742/
          node tests/mvp-preview-snapshots.mjs

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repairtrack-mvp-ui-screenshots
          path: mvp-screenshots/*.png
          retention-days: 14
          if-no-files-found: warn
