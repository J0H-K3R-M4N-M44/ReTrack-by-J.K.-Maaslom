name: EDP academic database integrity (disposable)

on:
  push:
    branches: [EDP-Course-MVP]
    paths:
      - 'course-edp/**'
      - '.github/workflows/edp-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      MYSQL_PWD: root
      REPAIRTRACK_EDP_TEST_DB: repairtrack_edp
      REPAIRTRACK_EDP_TEST_HOST: 127.0.0.1
      REPAIRTRACK_EDP_TEST_USER: root
    steps:
      - uses: actions/checkout@v4
      - name: Check self-contained SQL and PHP syntax without database access
        run: |
          set -euo pipefail
          php -l course-edp/app/actions.php
          php -l course-edp/app/catalogs.php
          php -l course-edp/app/intake.php
          php -l course-edp/app/bootstrap.php
          php -l course-edp/app/holiday-api.php
          php -l course-edp/public/holiday-api.php
          php -l course-edp/public/lab.php
          php -l course-edp/tests/edp-lab.php
          node --check course-edp/public/assets/lab.js
          python3 -m py_compile course-edp/tests/browser-hci.py
          php course-edp/tests/edp-lab.php
          php -l course-edp/app/technician.php
          php -l course-edp/app/manager.php
          php -l course-edp/app/cashier.php
          php -l course-edp/public/cashier.php
          php -l course-edp/tests/cashier-flow.php
          php -l course-edp/tests/full-journey-fixture.php
          python3 -m py_compile course-edp/tests/full-journey-http.py
          php -l course-edp/public/manager.php
          php -l course-edp/tests/manager-flow.php
          php -l course-edp/public/technician.php
          php -l course-edp/tests/technician-flow.php
          php -l course-edp/app/preview.php
          php -l course-edp/public/index.php
          php -l course-edp/app/tracking.php
          php -l course-edp/public/track.php
          php -l course-edp/tests/web-fixture.php
          python3 -m py_compile course-edp/tests/web-smoke.py
          php -l course-edp/tests/intake-flow.php
          php -l course-edp/tests/static-schema-check.php
          php -l course-edp/tests/db-integrity.php
          php -l course-edp/tests/db-concurrency.php
          php course-edp/tests/static-schema-check.php
      - name: Create a fresh isolated MySQL schema and seed fictional catalogs
        run: |
          set -euo pipefail
          php -r 'if (!extension_loaded("pdo_mysql")) { fwrite(STDERR, "pdo_mysql missing\n"); exit(1); }'
          sudo systemctl start mysql
          mysql -h 127.0.0.1 -u root < course-edp/schema.sql
          mysql -h 127.0.0.1 -u root < course-edp/seed_reference.sql
          mysql -N -h 127.0.0.1 -u root repairtrack_edp -e 'SELECT COUNT(*) FROM information_schema.tables WHERE table_schema="repairtrack_edp"' | grep -Fxq 23
      - name: Exercise foreign keys, CHECK constraints and fictional repair records
        run: |
          set -euo pipefail
          php course-edp/tests/db-integrity.php
          php course-edp/tests/intake-flow.php
          php course-edp/tests/technician-flow.php
          php course-edp/tests/manager-flow.php
          php course-edp/tests/cashier-flow.php
          php course-edp/tests/db-concurrency.php
          mysql -N -h 127.0.0.1 -u root repairtrack_edp -e 'SELECT COUNT(*) FROM customers' | grep -Fxq 0
          mysql -N -h 127.0.0.1 -u root repairtrack_edp -e 'SELECT COUNT(*) FROM repair_bill_payments' | grep -Fxq 0
          mysql -N -h 127.0.0.1 -u root repairtrack_edp -e 'SELECT COUNT(*) FROM ticket_status_events' | grep -Fxq 0
          mysql -N -h 127.0.0.1 -u root repairtrack_edp -e 'SELECT COUNT(*) FROM repair_tickets' | grep -Fxq 0
          mysql -N -h 127.0.0.1 -u root repairtrack_edp -e 'SELECT COUNT(*) FROM ticket_devices' | grep -Fxq 0
          mysql -N -h 127.0.0.1 -u root repairtrack_edp -e 'SELECT COUNT(*) FROM media_assets' | grep -Fxq 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install real-browser acceptance driver
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          command -v google-chrome || command -v chromium
      - name: Test authenticated academic intake web flow on localhost
        env:
          REPAIRTRACK_EDP_DB: repairtrack_edp
          REPAIRTRACK_EDP_HOST: 127.0.0.1
          REPAIRTRACK_EDP_USER: root
          REPAIRTRACK_EDP_PASSWORD: root
          REPAIRTRACK_EDP_PRIVATE_ROOT: ${{ runner.temp }}/edp-intake-private
          EDP_TEST_URL: http://127.0.0.1:8743
        run: |
          set -euo pipefail
          mkdir -p "$REPAIRTRACK_EDP_PRIVATE_ROOT"
          chmod 700 "$REPAIRTRACK_EDP_PRIVATE_ROOT"
          php -d upload_max_filesize=6M -d post_max_size=7M \
            -S 127.0.0.1:8743 -t course-edp/public > "$RUNNER_TEMP/edp-preview.log" 2>&1 &
          server_pid=$!
          # Sensitive ONLY to the synthetic test: fictional staff login and portal credentials.
          # Keep outside public/ and the screenshot artifact; delete even if a step fails.
          export EDP_BROWSER_JOURNEY_MANIFEST="$RUNNER_TEMP/edp-browser-journey.json"
          trap 'rm -f "$EDP_BROWSER_JOURNEY_MANIFEST"; kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -sSf -o /dev/null 'http://127.0.0.1:8743/?page=login'; then break; fi
            sleep 1
          done
          python3 course-edp/tests/full-journey-http.py
          test -f "$EDP_BROWSER_JOURNEY_MANIFEST"
          python3 course-edp/tests/web-smoke.py
          EDP_BROWSER_OUTPUT="$RUNNER_TEMP/edp-browser-screenshots" python3 course-edp/tests/browser-hci.py
      - name: Attach desktop/tablet/mobile browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edp-real-chromium-visual-acceptance
          path: ${{ runner.temp }}/edp-browser-screenshots/
          if-no-files-found: ignore
          retention-days: 14

  windows-notepad-build:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile exact WinForms FileSystemWatcher companion
        run: dotnet build course-edp/labs/NotepadCompanion/RepairTrackNotepad.csproj --configuration Release --nologo
