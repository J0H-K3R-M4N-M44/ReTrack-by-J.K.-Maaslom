name: Staff activity isolation
on:
  push:
    branches: [Tracking-And-Activity-UX]
    paths:
      - '.github/workflows/staff-activity.yml'
      - 'tests/staff-activity.php'
      - 'tests/activity-browser.mjs'
      - 'admin/activity.php'
      - 'views/**'
      - 'css/**'
      - 'js/**'
      - 'tools/simulation_data.php'
      - 'database/schema.sql'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unread-counts:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check activity against disposable MySQL
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          sudo systemctl start mysql
          sed 's/^CREATE DATABASE IF NOT EXISTS repairtrack$/CREATE DATABASE IF NOT EXISTS repairtrack_test_activity/;s/^USE repairtrack;$/USE repairtrack_test_activity;/' database/schema.sql | mysql -h 127.0.0.1 -u root
          cat > config/config.php <<'PHP'
          <?php
          return ['host' => '127.0.0.1', 'database' => 'repairtrack_test_activity',
              'username' => 'root', 'password' => getenv('MYSQL_PWD')];
          PHP
          php tests/staff-activity.php
      - name: Verify signed-in desktop and mobile inboxes
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright-core@1.56.1
          export ACTIVITY_FIXTURE="$RUNNER_TEMP/activity-password"
          umask 077
          php -r 'require "app/db.php"; require "tools/simulation_data.php"; $pdo = getPDO(); if ($pdo->query("SELECT DATABASE()")->fetchColumn() !== "repairtrack_test_activity") exit(1); echo seedSimulation($pdo);' > "$ACTIVITY_FIXTURE"
          php -S 127.0.0.1:8742 > "$RUNNER_TEMP/activity-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; rm -f "$ACTIVITY_FIXTURE"' EXIT
          curl --retry 8 --retry-connrefused --retry-delay 1 -fsS -o /dev/null http://127.0.0.1:8742/admin/login.php
          node tests/activity-browser.mjs
