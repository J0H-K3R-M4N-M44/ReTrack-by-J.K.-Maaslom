name: Staff activity isolation
on:
  push:
    branches: [Tracking-And-Activity-UX, Intake-Evidence-Checks, main]
    paths:
      - '.github/workflows/staff-activity.yml'
      - 'tests/*.php'
      - 'tools/*.php'
      - 'admin/*.php'
      - 'database/*.sql'
      - 'track.php'
      - 'tests/activity-browser.mjs'
      - 'tests/intake-receipt-browser.mjs'
      - 'views/**'
      - 'css/**'
      - 'js/**'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unread-counts:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check activity against disposable MySQL
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          sudo systemctl start mysql
          sed 's/^CREATE DATABASE IF NOT EXISTS repairtrack$/CREATE DATABASE IF NOT EXISTS repairtrack_test_activity/;s/^USE repairtrack;$/USE repairtrack_test_activity;/' database/schema.sql | mysql -h 127.0.0.1 -u root
          cat > config/config.php <<'PHP'
          <?php
          return ['host' => '127.0.0.1', 'database' => 'repairtrack_test_activity',
              'username' => 'root', 'password' => getenv('MYSQL_PWD')];
          PHP
          php tests/staff-activity.php
      - name: Verify signed-in desktop and mobile inboxes
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright-core@1.56.1
          export ACTIVITY_FIXTURE="$RUNNER_TEMP/activity-password"
          umask 077
          php -r 'require "app/db.php"; require "tools/simulation_data.php"; $pdo = getPDO(); if ($pdo->query("SELECT DATABASE()")->fetchColumn() !== "repairtrack_test_activity") exit(1); echo seedSimulation($pdo);' > "$ACTIVITY_FIXTURE"
          php -S 127.0.0.1:8742 > "$RUNNER_TEMP/activity-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; rm -f "$ACTIVITY_FIXTURE"' EXIT
          curl --retry 8 --retry-connrefused --retry-delay 1 -fsS -o /dev/null http://127.0.0.1:8742/admin/login.php
          node tests/activity-browser.mjs
      - name: Verify reports, seeded workflow and schema upgrades
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          php tests/staff-reports.php
          php tests/seeded-workflow.php
          php tests/migrations.php
      - name: Verify intake and ticket issuance against the regression fixtures
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          cat > config/config.php <<'PHP'
          <?php
          return ['host' => '127.0.0.1', 'database' => 'repairtrack_test_intake',
              'username' => 'root', 'password' => getenv('MYSQL_PWD'),
              'intake_storage_path' => getenv('RUNNER_TEMP') . '/intake',
              'intake_hmac_key' => str_repeat('ab', 32)];
          PHP
          mkdir -p "$RUNNER_TEMP/intake"
          sed 's/^CREATE DATABASE IF NOT EXISTS repairtrack$/CREATE DATABASE IF NOT EXISTS repairtrack_test_intake/;s/^USE repairtrack;$/USE repairtrack_test_intake;/' database/schema.sql | mysql -h 127.0.0.1 -u root
          sed 's/repairtrack_demo/repairtrack_test_intake/g' tests/fixtures/demo/seed_demo.sql | mysql -h 127.0.0.1 -u root
          export INTAKE_RECEIPT_FIXTURE="$RUNNER_TEMP/receipt-fixture.json"
          php tests/ticket-issuance.php
          php -S 127.0.0.1:8742 > "$RUNNER_TEMP/receipt-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --retry 8 --retry-connrefused --retry-delay 1 -fsS -o /dev/null http://127.0.0.1:8742/admin/login.php
          node tests/intake-receipt-browser.mjs
