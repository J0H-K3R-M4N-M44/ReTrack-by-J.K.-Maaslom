name: Staff activity isolation
on:
  push:
    branches: [Tracking-And-Activity-UX]
    paths:
      - '.github/workflows/staff-activity.yml'
      - 'tests/staff-activity.php'
      - 'tools/simulation_data.php'
      - 'database/schema.sql'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unread-counts:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check activity against disposable MySQL
        env:
          MYSQL_PWD: root
        run: |
          set -euo pipefail
          sudo systemctl start mysql
          sed 's/^CREATE DATABASE IF NOT EXISTS repairtrack$/CREATE DATABASE IF NOT EXISTS repairtrack_test_activity/;s/^USE repairtrack;$/USE repairtrack_test_activity;/' database/schema.sql | mysql -h 127.0.0.1 -u root
          cat > config/config.php <<'PHP'
          <?php
          return ['host' => '127.0.0.1', 'database' => 'repairtrack_test_activity',
              'username' => 'root', 'password' => getenv('MYSQL_PWD')];
          PHP
          php tests/staff-activity.php
